name: Deploy na AWS EC2

on:
  workflow_run:
    workflows: ["Builds, Tests and Push Docker"]
    types:
      - completed
    branches: [main]

jobs:
  Deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Implantação AWS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/minha-api:latest

            sudo docker stop minha-api 2>/dev/null || true
            sudo docker rm minha-api 2>/dev/null || true

            sudo docker run -d \
              --name minha-api \
              --restart unless-stopped \
              -p 8080:8000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/minha-api:latest

            sleep 5
            curl -f http://localhost:8080/health || exit 1

            echo "Deploy concluído com sucesso!"
            sudo docker image prune -f