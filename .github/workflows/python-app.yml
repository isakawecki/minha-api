
name: CI/CD - Homologação e Produção

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: minha-api

jobs:

  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Validar codigo
        run: python -m compileall -q app

      - name: Construir imagem Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Salvar imagem
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o minha-api.tar

      - name: Armazenar imagem
        uses: actions/upload-artifact@v4
        with:
          name: imagem-docker
          path: minha-api.tar
          retention-days: 1

  Deploy_Homologacao:
    needs: Build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: homologacao

    steps:
      - name: Baixar imagem
        uses: actions/download-artifact@v4
        with:
          name: imagem-docker

      - name: Enviar imagem para EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: minha-api.tar
          target: /home/ubuntu/

      - name: Executar deploy HOMOL
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker load -i /home/ubuntu/minha-api.tar
            sudo docker rm -f minha-api-homol || true
            sudo docker run -d \
              --restart unless-stopped \
              --name minha-api-homol \
              -p 8080:8000 \
              minha-api:${{ github.sha }}

  Deploy_Producao:
    needs: Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: producao

    steps:
      - name: Baixar imagem
        uses: actions/download-artifact@v4
        with:
          name: imagem-docker

      - name: Enviar imagem para EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: minha-api.tar
          target: /home/ubuntu/

      - name: Executar deploy PRD
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker load -i /home/ubuntu/minha-api.tar
            sudo docker rm -f minha-api-prd || true
            sudo docker run -d \
              --restart unless-stopped \
              --name minha-api-prd \
              -p 80:8000 \
              minha-api:${{ github.sha }}
